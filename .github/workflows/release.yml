name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'guides/**'
      - 'LICENSE'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A red main must not be tagged. This job starts alongside the test
      # workflows rather than after them, so wait for every other check on this
      # commit and refuse to tag unless they all passed.
      #
      # Fail closed when no checks are found: every workflow that runs on a push
      # to main ignores a subset of the paths ignored above, so any change that
      # reaches this job reached them too. No checks means something is wrong,
      # not that there was nothing to run.
      - name: Require green checks on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 1 90); do
            RUNS=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
              -q '.check_runs[] | select(.name != "release") | "\(.status):\(.conclusion) \(.name)"')
            if [ -n "$RUNS" ] && ! printf '%s\n' "$RUNS" | grep -qv '^completed:'; then
              FAILED=$(printf '%s\n' "$RUNS" | grep -Ev '^completed:(success|skipped|neutral) ' || true)
              if [ -n "$FAILED" ]; then
                echo "Not tagging $SHA - these checks did not pass:"
                printf '%s\n' "$FAILED"
                exit 1
              fi
              echo "All checks green on $SHA"
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for checks on $SHA"
          exit 1

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "next=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "initial=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "initial=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate bumped version
        if: steps.version.outputs.initial == 'false'
        uses: orhun/git-cliff-action@v4
        id: bump
        with:
          args: --bumped-version

      - name: Check if version changed
        if: steps.version.outputs.initial == 'false'
        id: check
        env:
          BUMP_CONTENT: ${{ steps.bump.outputs.content }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          NEXT=$(echo "$BUMP_CONTENT" | tr -d '[:space:]')
          if [ "$NEXT" = "$LATEST" ] || [ -z "$NEXT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "next=$NEXT" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: resolve
        env:
          IS_INITIAL: ${{ steps.version.outputs.initial }}
          INITIAL_NEXT: ${{ steps.version.outputs.next }}
          CHECK_NEXT: ${{ steps.check.outputs.next }}
          CHECK_SKIP: ${{ steps.check.outputs.skip }}
        run: |
          if [ "$IS_INITIAL" = "true" ]; then
            echo "next=$INITIAL_NEXT" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "next=$CHECK_NEXT" >> "$GITHUB_OUTPUT"
            echo "skip=$CHECK_SKIP" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.resolve.outputs.skip == 'false'
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          args: --unreleased --strip header --tag ${{ steps.resolve.outputs.next }}

      - name: Create tag and release
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
          TAG: ${{ steps.resolve.outputs.next }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$CHANGELOG"
